<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starbucks Day Dot Helper</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>
    :root {
        --sb-green: #1e3932;
        --sb-green-light: #2e544c;
        --sb-green-muted: #3a6b61;
        --sb-dark: #0d2620;
        --sb-light: #f7f7f7;
        --sb-accent: #00704a;
        --text-light: #fff;
        --text-dark: #000;
    }

    body {
        font-family: 'Montserrat', sans-serif;
        margin: 0;
        padding: 0;
        color: var(--text-light);
        background: linear-gradient(180deg, var(--sb-green) 0%, var(--sb-green-light) 50%, var(--sb-green-muted) 100%);
        background-attachment: fixed;
        transition: background 0.3s, color 0.3s;
    }

    body.light {
        background: var(--sb-light);
        color: var(--text-dark);
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('https://i.imgur.com/8fKQx7M.png');
        background-size: 500px;
        background-repeat: no-repeat;
        background-position: center;
        opacity: 0.08;
        pointer-events: none;
    }

    header {
        background: var(--sb-dark);
        padding: 20px;
        font-size: 28px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
    }

    #clock {
        font-size: 18px;
        opacity: 0.8;
    }

    #modeToggle {
        background: var(--sb-accent);
        border: none;
        padding: 10px 15px;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        font-size: 14px;
    }

    .menu {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
    }

    .menu button {
        background: var(--sb-accent);
        border: none;
        padding: 12px 20px;
        border-radius: 10px;
        color: white;
        font-size: 18px;
        cursor: pointer;
    }

    .container {
        margin: 20px auto;
        max-width: 700px;
        background: rgba(0,0,0,0.35);
        padding: 20px;
        border-radius: 12px;
        backdrop-filter: blur(4px);
    }

    body.light .container {
        background: rgba(255,255,255,0.7);
    }

    select, input {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        border: none;
        font-size: 16px;
    }

    button.calc {
        background: var(--sb-accent);
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        margin-top: 10px;
    }

    .result {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
        background: rgba(0,0,0,0.4);
        padding: 15px;
        border-radius: 10px;
    }

    .product-list {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .product {
        background: var(--sb-accent);
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    footer {
        margin-top: 40px;
        padding: 10px;
        font-size: 14px;
        opacity: 0.7;
        text-align: center;
    }

    .shelf-section h3 {
        margin-top: 20px;
        font-size: 20px;
        text-decoration: underline;
    }

    .shelf-section ul {
        list-style: none;
        padding-left: 0;
        margin-bottom: 20px;
    }

    .shelf-section li {
        margin: 6px 0;
        font-size: 16px;
    }

    /* Starbucks-themed calendar date picker */
    .sb-date {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 10px;
        border: 2px solid var(--sb-accent);
        background: rgba(255,255,255,0.15);
        color: var(--text-light);
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    body.light .sb-date {
        background: rgba(0,0,0,0.05);
        color: var(--text-dark);
        border: 2px solid var(--sb-green);
    }

    .sb-date:hover {
        border-color: #009a63;
        background: rgba(255,255,255,0.25);
    }

    body.light .sb-date:hover {
        background: rgba(0,0,0,0.1);
        border-color: #1e3932;
    }

    .sb-date::-webkit-calendar-picker-indicator {
        filter: invert(80%) sepia(20%) saturate(300%) hue-rotate(100deg);
        cursor: pointer;
    }

    /* Styled Start Mode selector */
    #startMode {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 10px;
        border: 2px solid var(--sb-accent);
        background: rgba(255,255,255,0.15);
        color: var(--text-light);
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    body.light #startMode {
        background: rgba(0,0,0,0.05);
        color: var(--text-dark);
        border: 2px solid var(--sb-green);
    }

    #startMode:hover {
        border-color: #009a63;
        background: rgba(255,255,255,0.25);
    }

    body.light #startMode:hover {
        background: rgba(0,0,0,0.1);
        border-color: #1e3932;
    }

    /* Modal background overlay */
    .sb-modal {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.6);
    }

    /* Modal box */
    .sb-modal-content {
        background: #1e3932;
        margin: 10% auto;
        padding: 25px;
        border-radius: 15px;
        width: 80%;
        max-width: 400px;
        color: white;
        position: relative;
        animation: sbModalFade 0.25s ease-out;
        background-image: url('https://i.imgur.com/8fKQx7M.png');
        background-size: 250px;
        background-repeat: no-repeat;
        background-position: center;
        opacity: 0.95;
    }

    .sb-close {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 28px;
        cursor: pointer;
        opacity: 0.8;
    }

    .sb-close:hover {
        opacity: 1;
    }

    .sb-modal-btn {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background: #00704a;
        border: none;
        border-radius: 10px;
        color: white;
        font-size: 18px;
        cursor: pointer;
    }

    .sb-modal-btn:hover {
        background: #009a63;
    }

    @keyframes sbModalFade {
        from {
            opacity: 0;
            transform: scale(0.95);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }
</style>
</head>

<body>

<header>
    ☕ Starbucks Day Dot Helper
    <div>
        <span id="clock"></span>
        <button id="modeToggle">Light Mode</button>
    </div>
</header>

<div class="menu">
    <button onclick="showTool('daydot')">Day Dot Helper</button>
    <button onclick="showTool('shelflife')">Shelf‑Life Document</button>
</div>

<div class="container" id="daydot">
    <h2>Day Dot Calculator</h2>

    <h3>Start Date</h3>
    <select id="startMode">
        <option value="now">Now (Current Date & Time)</option>
        <option value="from">From a Selected Date</option>
    </select>

    <input type="date" id="fromDate" class="sb-date" style="display:none;">

    <select id="preset">
        <option value="0">Choose preset...</option>
        <option value="1">24 Hours</option>
        <option value="2">2 Days</option>
        <option value="3">3 Days</option>
        <option value="4">4 Days</option>
        <option value="5">5 Days</option>
        <option value="6">6 Days</option>
        <option value="8">8 Days</option>
        <option value="10">10 Days</option>
        <option value="14">14 Days</option>
        <option value="16">16 Days</option>
        <option value="29">29 Days</option>
        <option value="30">1 Month</option>
        <option value="60">2 Months</option>
        <option value="90">3 Months</option>
        <option value="custom">Custom (Adhoc)</option>
    </select>

    <div id="customBlock" style="display:none;">
        <select id="customType">
            <option value="hours">Hours</option>
