<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Starbucks Day Dot Helper v2</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #006241; /* Starbucks green */
            color: white;
        }

        header {
            background-color: #004f33;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav {
            background-color: #003d27;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            padding: 8px 16px;
            border: 2px solid white;
            border-radius: 6px;
        }

        nav a:hover {
            background-color: white;
            color: #003d27;
        }

        .container {
            padding: 20px;
        }

        .section-title {
            font-size: 26px;
            margin-bottom: 10px;
            border-bottom: 2px solid white;
            padding-bottom: 5px;
        }

        .calculator-box {
            background-color: #004f33;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .staple-items {
            background-color: #003d27;
            padding: 20px;
            border-radius: 10px;
        }

        .staple-items button {
            display: block;
            width: 100%;
            margin: 8px 0;
            padding: 12px;
            font-size: 18px;
            background-color: white;
            color: #003d27;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .staple-items button:hover {
            background-color: #cce3d8;
        }

        .mode-select {
            margin-bottom: 15px;
        }

        .mode-select button {
            padding: 10px 20px;
            margin-right: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .now-btn {
            background-color: #ffffff;
            color: #003d27;
        }

        .future-btn {
            background-color: #cce3d8;
            color: #003d27;
        }

        /* Shelf Life Page */
        #shelf-life-page {
            display: none;
        }
    </style>

    <script>
        function showPage(page) {
            document.getElementById("main-page").style.display = page === "main" ? "block" : "none";
            document.getElementById("shelf-life-page").style.display = page === "shelf" ? "block" : "none";
        }

        function setMode(mode) {
            alert("Calculator mode set to: " + mode);
            // Insert your existing calculator logic here
        }

        function completeStapleTask(item) {
            alert("Completed: " + item);
            // Insert your existing staple item logic here
        }
    </script>
</head>

<body>

<header>Starbucks Day Dot Helper — Version 2</header>

<nav>
    <a href="#" onclick="showPage('main')">Day Dot Helper</a>
    <a href="#" onclick="showPage('shelf')">Shelf Life Document</a>
</nav>

<div class="container">

    <!-- MAIN PAGE -->
    <div id="main-page">
        <div class="section-title">Day Dot Calculator</div>

        <div class="calculator-box">
            <div class="mode-select">
                <button class="now-btn" onclick="setMode('now')">Now</button>
                <button class="future-btn" onclick="setMode('future')">Future</button>
            </div>

            <!-- Insert your calculator UI from Version 1 here -->
            <p>Calculator goes here…</p>
        </div>

        <div class="section-title">Staple Items</div>

        <div class="staple-items">
            <!-- Replace these with your actual staple items -->
            <button onclick="completeStapleTask('Milk Pitchers')">Milk Pitchers</button>
            <button onclick="completeStapleTask('Whipped Cream')">Whipped Cream</button>
            <button onclick="completeStapleTask('Cold Brew')">Cold Brew</button>
            <button onclick="completeStapleTask('Mocha')">Mocha</button>
            <button onclick="completeStapleTask('Frapp Roast')">Frapp Roast</button>
        </div>
    </div>

    <!-- SHELF LIFE PAGE -->
    <div id="shelf-life-page">
        <div class="section-title">Shelf Life Document</div>

        <!-- Insert your full shelf-life document from Version 1 here -->
        <p>Your shelf life document content goes here…</p>
    </div>

</div>

</body>
</html>
