<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Starbucks Day Dot Helper</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sb-green:#1e3932;
    --sb-accent:#00704a;
    --sb-dark:#0d2620;
    --light-bg:#f7f7f7;
    --text-light:#fff;
    --text-dark:#111;
  }

  html,body{height:100%;margin:0;font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;}
  body{
    background:linear-gradient(180deg,var(--sb-green) 0%, #2e544c 55%, #3a6b61 100%);
    color:var(--text-light);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  body.light{
    background:var(--light-bg);
    color:var(--text-dark);
  }

  header{
    display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:rgba(0,0,0,0.25);
    backdrop-filter:blur(6px);
  }
  header h1{margin:0;font-size:18px;font-weight:700;}
  #clock{font-size:13px;opacity:0.9;margin-right:12px;}
  #modeToggle{background:var(--sb-accent);border:none;color:#fff;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;}

  .menu{display:flex;gap:12px;justify-content:center;padding:14px 10px;}
  .menu button{background:rgba(255,255,255,0.06);border:none;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;font-size:14px;}
  body.light .menu button{background:#fff;color:var(--text-dark);border:1px solid #e6e6e6;}

  .wrap{max-width:820px;margin:18px auto;padding:18px;border-radius:12px;background:rgba(0,0,0,0.28);backdrop-filter:blur(6px);}
  body.light .wrap{background:rgba(255,255,255,0.9);}

  h2{margin:0 0 12px 0;font-size:20px;}
  h3{margin:18px 0 8px 0;font-size:16px;}

  select,input[type="date"],input[type="number"]{
    width:100%;padding:10px;border-radius:8px;border:none;font-size:15px;margin-top:8px;
  }
  .sb-date{border:2px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);color:inherit;}
  body.light .sb-date{background:#fff;border:1px solid #ddd;color:var(--text-dark);}

  .calc{display:inline-block;background:var(--sb-accent);color:#fff;padding:10px 14px;border-radius:10px;border:none;cursor:pointer;margin-top:12px;font-size:15px;}

  .result{margin-top:16px;padding:12px;border-radius:10px;background:rgba(0,0,0,0.35);font-weight:700;}
  body.light .result{background:#fff;border:1px solid #eee;color:var(--text-dark);}

  .product-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
  .product{flex:1 1 48%;min-width:160px;background:var(--sb-accent);color:#fff;padding:10px;border-radius:10px;border:none;cursor:pointer;text-align:left;font-size:14px;}
  body.light .product{background:#e9f6ef;color:var(--sb-green);border:1px solid #dfeee6;}

  footer{margin-top:18px;padding:10px;text-align:center;opacity:0.8;font-size:13px;}

  /* Quick modal overlay */
  #quickModal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.55);-webkit-overflow-scrolling:touch;}
  #quickModalContent{
    width:92%;max-width:420px;margin:10% auto;background:var(--sb-green);color:#fff;border-radius:12px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,0.5);
    transform-origin:center center;animation:popIn 180ms ease-out;
  }
  @keyframes popIn{from{opacity:0;transform:scale(0.98)}to{opacity:1;transform:scale(1)}}
  #quickModalContent h3{margin:0 0 8px 0;}
  .qm-buttons{display:flex;gap:10px;margin-top:8px;}
  .qm-btn{flex:1;padding:10px;border-radius:10px;border:none;background:#00704a;color:#fff;cursor:pointer;font-size:14px;}
  .qm-btn:hover{background:#009a63;}
  #qmFutureBlock{display:none;margin-top:12px;}
  #qmFutureDate{width:100%;padding:10px;border-radius:8px;border:none;margin-bottom:10px;}
  #qmClose{margin-top:8px;text-align:right;opacity:0.9;cursor:pointer;font-size:13px;}

  /* Responsive tweaks */
  @media (max-width:520px){
    .product{flex:1 1 100%;}
    #quickModalContent{margin:18% auto;padding:14px;}
  }
</style>
</head>
<body>

<header>
  <h1>☕ Starbucks Day Dot Helper</h1>
  <div style="display:flex;align-items:center;">
    <div id="clock" aria-live="polite">--:--:--</div>
    <button id="modeToggle">Light Mode</button>
  </div>
</header>

<div class="menu">
  <button onclick="showTool('daydot')">Day Dot Helper</button>
  <button onclick="showTool('shelflife')">Shelf‑Life Document</button>
</div>

<div class="wrap" id="daydot">
  <h2>Day Dot Calculator</h2>

  <h3>Start From</h3>
  <select id="startMode" aria-label="Start mode">
    <option value="future">Future Date</option>
    <option value="now">Now (Current Date & Time)</option>
  </select>

  <input id="fromDate" class="sb-date" type="date" aria-label="Start date">

  <h3>Preset / Custom</h3>
  <select id="preset" aria-label="Preset">
    <option value="0">Choose preset...</option>
    <option value="1">24 Hours</option>
    <option value="2">2 Days</option>
    <option value="3">3 Days</option>
    <option value="4">4 Days</option>
    <option value="5">5 Days</option>
    <option value="6">6 Days</option>
    <option value="7">7 Days</option>
    <option value="8">8 Days</option>
    <option value="10">10 Days</option>
    <option value="14">14 Days</option>
    <option value="16">16 Days</option>
    <option value="29">29 Days</option>
    <option value="30">1 Month</option>
    <option value="60">2 Months</option>
    <option value="90">3 Months</option>
    <option value="custom">Custom (Adhoc)</option>
  </select>

  <div id="customBlock" style="display:none;margin-top:8px;">
